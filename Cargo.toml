[workspace]
resolver = "2"
members = [
    "crates/tf-core",
    "crates/tf-grid",
    "crates/tf-sim",
    "crates/tf-server",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
authors = ["kamisama <mzxl41@163.com>"]
repository = "https://github.com/aforgomon41-create/TerraForge"

[workspace.dependencies]
tf-core = { path = "crates/tf-core" }
tf-grid = { path = "crates/tf-grid" }
tf-sim  = { path = "crates/tf-sim" }

# 数值与并行
rayon = "1.11"
glam = { version = "0.30", features = ["serde"] }
num-traits = "0.2"
hashbrown = "0.15"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"

# 确定性随机
rand = { version = "0.8", default-features = false }
rand_chacha = "0.3"

# 日志与错误
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# 位图
bitvec = "1"

# 压缩
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# 让物理模拟在 debug 下也能跑（否则慢到没法调试）
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
